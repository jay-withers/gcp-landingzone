name: ci-terraform

# Credential-free init, validate and `terraform test` (mocked google provider)
# of every component, through the shared workflow, which owns the path filter
# and the always-reporting gate that becomes "terraform / Terraform".
#
# No credentialled plan on pull requests, deliberately, as in
# azure-landingzone: the only identity that can read everything these
# components manage is the apply identity, and branch code never gets it (its
# binding trusts the main-only `apply` environment alone).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # pull-requests: read is what the shared workflow's path filter needs; the
  # filter runs inside that workflow, so the permission is granted from here.
  terraform:
    permissions:
      contents: read
      pull-requests: read
    uses: jay-withers/workflows/.github/workflows/terraform.yml@ed119fa2b4c554074ef189cc6d16696a41a833b6 # v1.31.2
    with:
      directories: '["terraform/bootstrap"]'
      test-directories: '["terraform/bootstrap"]'
